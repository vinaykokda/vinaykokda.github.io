<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Vinay Kokda | 28-Min 1-on-1 Creator Mentorship</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #060913;
      --card-dark: #0e1626;
      --card-dark-subtle: #131c31;
      --text-white: #f8fafc;
      --text-muted: #94a3b8;
      --gold-primary: #f59e0b;
      --gold-glow: #fbbf24;
      --border-dark: rgba(255, 255, 255, 0.08);
      --accent-blue: #0b7cff;
      --accent-blue-hover: #0066dc;
      --whatsapp-green: #16a34a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-white);
      padding: 14px 14px 120px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
    }

    .app-wrapper {
      width: 100%;
      max-width: 440px;
      position: relative;
    }

    .screen-panel {
      display: none;
      opacity: 0;
      transform: translateY(18px);
    }
    .screen-panel.active {
      display: block;
      animation: slideUpFadeIn 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes slideUpFadeIn {
      0% { opacity: 0; transform: translateY(18px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    button, .slot-card-opt, .date-pill-opt, .mini-social-badge, .footer-soc-btn {
      transition: transform 0.15s ease, filter 0.15s ease;
      cursor: pointer;
    }
    button:active, .slot-card-opt:not(.locked-slot):active, .date-pill-opt:active, .mini-social-badge:active, .footer-soc-btn:active {
      transform: scale(0.965);
    }

    .home-top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 4px;
    }
    .header-secret-trigger {
      font-size: 13.5px;
      font-weight: 700;
      color: #94a3b8;
      cursor: pointer;
      user-select: none;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }
    .pulse-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 10px;
      height: 10px;
    }
    .radar-pulse-ring {
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.45);
      animation: radarPing 2.2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    @keyframes radarPing {
      0% { transform: scale(0.6); opacity: 0.95; }
      80%, 100% { transform: scale(2.4); opacity: 0; }
    }
    .online-dot-mini {
      width: 7.5px;
      height: 7.5px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
      z-index: 2;
    }

    .dark-card {
      background: var(--card-dark);
      border: 1px solid var(--border-dark);
      border-radius: 26px;
      padding: 24px 20px;
      margin-bottom: 14px;
      box-shadow: 0 10px 30px -10px rgba(0,0,0,0.6);
      position: relative;
    }
    .hero {
      text-align: center;
    }

    .slot-badge-top {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6.5px 15px;
      border-radius: 99px;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: var(--gold-primary);
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 18px;
    }
    .slot-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }

    .avatar-ring-container {
      position: relative;
      width: 138px;
      height: 138px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }
    .avatar-breathing-aura {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.45) 0%, rgba(245, 158, 11, 0) 70%);
      animation: auraPulse 3.5s ease-in-out infinite;
      z-index: 1;
    }
    @keyframes auraPulse {
      0%, 100% { transform: scale(0.93); opacity: 0.45; }
      50% { transform: scale(1.15); opacity: 0.9; }
    }
    .ring-spin {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(#f59e0b, #fde047, #38bdf8, #f59e0b);
      animation: spin 7.5s linear infinite;
      z-index: 2;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .avatar-inner {
      position: relative;
      z-index: 3;
      width: 124px;
      height: 124px;
      border-radius: 50%;
      background: #000000;
      border: 3.5px solid var(--card-dark);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(0,0,0,0.5);
    }
    .avatar-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 50%;
    }
    .avatar-status-dot {
      position: absolute;
      bottom: 8px;
      right: 10px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #10b981;
      border: 3.5px solid var(--card-dark);
      box-shadow: 0 0 10px #10b981;
      z-index: 4;
    }

    .creator-handle-tag {
      font-size: 13.5px;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .verified-tick {
      color: #38bdf8;
      font-size: 14px;
    }

    .mini-social-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .mini-social-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-decoration: none;
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 700;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .mini-social-badge svg {
      width: 13px;
      height: 13px;
      display: block;
      flex-shrink: 0;
    }

    .hero-title {
      font-size: 24.5px;
      line-height: 1.35;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 12px;
      letter-spacing: -0.4px;
    }
    .hero-title .gold-accent {
      background: linear-gradient(90deg, #f59e0b, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .call-duration-sub {
      font-size: 13.2px;
      font-weight: 600;
      color: #cbd5e1;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    .feature-chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }
    .chip-pill {
      font-size: 11.5px;
      font-weight: 700;
      padding: 6.5px 12.5px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
    }

    .content-block-card {
      background: var(--card-dark);
      border: 1px solid var(--border-dark);
      border-radius: 24px;
      padding: 20px 18px;
      margin-bottom: 14px;
    }
    .block-heading {
      font-size: 15.5px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .check-list-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }
    .check-item-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 13px;
      line-height: 1.48;
      color: #e2e8f0;
      font-weight: 600;
    }
    .check-icon-green {
      color: #10b981;
      font-size: 14px;
      font-weight: 900;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .not-for-box {
      margin-top: 14px;
      padding: 12px 14px;
      background: rgba(239, 68, 68, 0.08);
      border: 1px dashed rgba(239, 68, 68, 0.35);
      border-radius: 14px;
      font-size: 12.5px;
      color: #fca5a5;
      line-height: 1.5;
      font-weight: 600;
    }

    .timeline-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .timeline-item {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 10px 12px;
      border-radius: 14px;
    }
    .timeline-stamp {
      background: rgba(11, 124, 255, 0.15);
      color: #38bdf8;
      font-weight: 800;
      font-size: 11.5px;
      padding: 4px 8px;
      border-radius: 8px;
      flex-shrink: 0;
    }
    .timeline-text {
      font-size: 12.5px;
      color: #cbd5e1;
      line-height: 1.4;
      font-weight: 600;
    }
    .timeline-text b {
      color: #ffffff;
    }

    .faq-section {
      background: var(--card-dark);
      border: 1px solid var(--border-dark);
      border-radius: 24px;
      padding: 20px 18px;
      margin-bottom: 14px;
    }
    .faq-item {
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding: 12px 0;
    }
    .faq-item:first-child {
      padding-top: 0;
    }
    .faq-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    .faq-q {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13.5px;
      font-weight: 700;
      color: #e2e8f0;
      cursor: pointer;
      user-select: none;
    }
    .faq-icon {
      color: var(--gold-primary);
      font-size: 18px;
      font-weight: 800;
      line-height: 1;
      transition: transform 0.25s ease, color 0.2s ease;
    }
    .faq-a {
      display: none;
      font-size: 12.8px;
      line-height: 1.55;
      color: var(--text-muted);
      padding-top: 8px;
    }
    .faq-item.active .faq-a {
      display: block;
    }
    .faq-item.active .faq-icon {
      transform: rotate(45deg);
      color: #ef4444;
    }

    .footer-social-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-dark);
      border-radius: 22px;
      padding: 18px 16px;
      text-align: center;
      margin-bottom: 14px;
    }
    .footer-social-title {
      font-size: 12px;
      font-weight: 800;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 12px;
    }
    .footer-social-links {
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    .footer-soc-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .footer-soc-btn svg {
      width: 15px;
      height: 15px;
      display: block;
      flex-shrink: 0;
    }

    .bottom-sticky-bar {
      position: fixed;
      bottom: 14px;
      left: 14px;
      right: 14px;
      max-width: 440px;
      margin: 0 auto;
      background: rgba(9, 14, 26, 0.95);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 99px;
      padding: 9px 9px 9px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 16px 36px rgba(0,0,0,0.7);
      z-index: 50;
      backdrop-filter: blur(10px);
    }
    .bottom-info-pill b {
      font-size: 13.5px;
      font-weight: 800;
      color: #ffffff;
      display: block;
    }
    .bottom-info-pill span {
      font-size: 11.5px;
      color: var(--gold-primary);
      font-weight: 700;
    }
    .btn-book-gold {
      position: relative;
      background: linear-gradient(90deg, #f59e0b, #fbbf24);
      color: #090e1a;
      border: none;
      padding: 12px 24px;
      border-radius: 99px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.35);
      overflow: hidden;
    }
    .btn-book-gold::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -120%;
      width: 70%;
      height: 200%;
      background: linear-gradient(
        60deg,
        rgba(255, 255, 255, 0) 20%,
        rgba(255, 255, 255, 0.55) 50%,
        rgba(255, 255, 255, 0) 80%
      );
      transform: rotate(25deg);
      animation: shimmerWave 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes shimmerWave {
      0%, 65% { left: -120%; }
      100% { left: 160%; }
    }

    .wizard-white-card {
      background: #ffffff;
      color: #0f172a;
      border-radius: 28px;
      padding: 24px 20px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.5);
    }
    .wizard-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .header-actions-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-home-nav-chip {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #334155;
      padding: 5px 12px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .back-arrow-link {
      background: none;
      border: none;
      color: #64748b;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .step-counter-pill {
      background: #fef3c7;
      color: #b45309;
      padding: 4px 12px;
      border-radius: 99px;
      font-size: 11.5px;
      font-weight: 800;
    }
    .wizard-title {
      font-size: 20px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 4px;
    }
    .wizard-subtitle {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 18px;
    }

    .session-active-card {
      border: 1.5px solid #e2e8f0;
      border-radius: 22px;
      padding: 20px;
      background: #ffffff;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    }
    .session-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .session-active-badge {
      background: #ecfdf5;
      color: #059669;
      border: 1px solid #a7f3d0;
      padding: 4px 12px;
      border-radius: 99px;
      font-size: 11.5px;
      font-weight: 800;
    }
    .session-heading-title {
      font-size: 18px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 8px;
      line-height: 1.35;
    }
    .session-desc-text {
      font-size: 13px;
      color: #475569;
      line-height: 1.55;
      margin-bottom: 16px;
    }
    .session-point-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 12.5px;
      color: #1e293b;
      margin-bottom: 8px;
      font-weight: 600;
      line-height: 1.45;
    }
    .session-point-item span.chk {
      color: #0b7cff;
      font-weight: 800;
    }

    .session-metrics-box {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 12px 6px;
      margin-top: 16px;
      margin-bottom: 16px;
      text-align: center;
    }
    .session-metric-cell {
      border-right: 1px solid #e2e8f0;
    }
    .session-metric-cell:last-child {
      border-right: none;
    }
    .session-metric-cell b {
      display: block;
      font-size: 14px;
      font-weight: 900;
      color: #0f172a;
    }
    .session-metric-cell span {
      display: block;
      font-size: 9.5px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      margin-top: 2px;
      letter-spacing: 0.3px;
    }

    .session-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 14px;
      border-top: 1px solid #f1f5f9;
    }
    .session-meta-info {
      font-size: 12.5px;
      font-weight: 800;
      color: #0f172a;
    }
    .session-meta-info span {
      display: block;
      font-size: 11px;
      color: #64748b;
      font-weight: 600;
    }
    .btn-select-session-price {
      background: #0b7cff;
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      border-radius: 99px;
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
    }

    .date-selector-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .date-pill-opt {
      border: 1.5px solid #e2e8f0;
      border-radius: 16px;
      padding: 12px 6px;
      text-align: center;
      cursor: pointer;
      background: #ffffff;
    }
    .date-pill-opt.selected {
      border-color: #0b7cff;
      background: #eff6ff;
    }
    .date-pill-opt .d-day {
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
    }
    .date-pill-opt .d-num {
      font-size: 18px;
      font-weight: 800;
      color: #0f172a;
      margin: 3px 0;
    }
    .date-pill-opt .d-mon {
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
    }

    .slot-choice-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }
    .slot-card-opt {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border: 1.5px solid #e2e8f0;
      border-radius: 16px;
      cursor: pointer;
      background: #ffffff;
    }
    .slot-card-opt.selected {
      border-color: #0b7cff;
      background: #eff6ff;
    }
    .slot-card-opt.locked-slot {
      opacity: 0.5;
      background: #f8fafc;
      border-color: #cbd5e1;
      cursor: not-allowed;
      pointer-events: none;
    }
    .slot-card-opt.locked-slot .time-title {
      text-decoration: line-through;
      color: #94a3b8;
    }
    .time-tag {
      font-size: 11px;
      font-weight: 700;
      color: #0b7cff;
      background: #dbeafe;
      padding: 4px 8px;
      border-radius: 99px;
    }
    .time-tag-locked {
      background: #fee2e2;
      color: #ef4444;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 99px;
      border: 1px solid #fecaca;
    }

    .input-group {
      margin-bottom: 14px;
    }
    .input-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 6px;
    }
    .text-input-field {
      width: 100%;
      padding: 13px 14px;
      border-radius: 14px;
      border: 1.5px solid #cbd5e1;
      font-size: 14px;
      color: #0f172a;
      outline: none;
      background: #ffffff;
    }
    .text-input-field:focus {
      border-color: #0b7cff;
    }
    .field-error-text {
      font-size: 12px;
      font-weight: 600;
      color: #ef4444;
      margin-top: 4px;
      display: none;
    }
    .btn-primary-blue {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 16px;
      background: var(--accent-blue);
      color: #ffffff;
      font-size: 14.5px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content:
